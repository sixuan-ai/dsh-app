# DSH 注册服务(企业邮箱验证码)的反代片段。
#
# 现有配置里 `location /directory/` 把整个前缀都转给 3085(登录路由),
# 因此注册接口必须用更精确的 location 放在它**前面**才能命中 3086。
# nginx 会优先匹配更长的前缀,所以顺序与书写位置无关,但为便于阅读仍放在
# /directory/ 之前。
#
# 用法:把下面两个 location 复制进 /etc/nginx/conf.d/dsh-ainotex.conf 的
# 443 server 块内(与现有 location /directory/ 同级),然后 nginx -t && reload。
#
# 安全要点:
#  - 注册接口不需要 Basic 认证(新用户还没有账号),但必须限流,否则会被
#    当成免费的邮件发送器滥用。
#  - 这里给的是比 /api/ 更严的限流:5r/s + burst 5。

location /directory/register/ {
    # Stricter than the general API lane: each call can trigger an email.
    limit_req zone=dsh_api burst=5 nodelay;

    proxy_pass http://127.0.0.1:3086;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
}
